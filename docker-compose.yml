services:

  # ── FastAPI backend ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-unknown}"
        VCS_REF: "${VCS_REF:-unknown}"
    image: finanalyzer-api:latest
    container_name: finanalyzer-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Persist embeddings and database across restarts
      - faiss_data:/app/data/embeddings
      - db_data:/app/data/processed
      - raw_data:/app/data/raw
      - charts_data:/app/ui/charts
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: >
      python -m uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2

  # ── Gradio UI ───────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: finanalyzer-ui:latest
    container_name: finanalyzer-ui
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file: .env
    environment:
      - API_BASE=http://api:8000
      - GRADIO_SERVER_PORT=7860
    volumes:
      - charts_data:/app/ui/charts
    depends_on:
      api:
        condition: service_healthy
    command: python ui/app.py

  # ── One-shot data bootstrap (runs once, exits) ──────────────────────────
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    image: finanalyzer-api:latest
    container_name: finanalyzer-setup
    env_file: .env
    volumes:
      - faiss_data:/app/data/embeddings
      - db_data:/app/data/processed
      - raw_data:/app/data/raw
    command: >
      sh -c "
        python scripts/generate_sample_data.py &&
        python scripts/load_sql_db.py &&
        python scripts/ingest_all.py &&
        echo 'Setup complete.'
      "
    profiles:
      # Run only when explicitly requested:  docker compose --profile setup up setup
      - setup

volumes:
  faiss_data:
  db_data:
  raw_data:
  charts_data:
