name: RAG Evaluation

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      num_samples:
        description: "Number of eval samples to run (default: all)"
        required: false
        default: "8"

jobs:
  evaluate:
    name: RAGAS Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Create directories
        run: |
          mkdir -p data/raw data/processed data/embeddings/faiss_index
          mkdir -p reports/output

      - name: Generate sample data
        run: poetry run python scripts/generate_sample_data.py

      - name: Load SQL database
        run: poetry run python scripts/load_sql_db.py

      - name: Ingest documents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: poetry run python scripts/ingest_all.py

      - name: Run RAGAS evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
        run: poetry run python scripts/evaluate_rag.py

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-${{ github.run_id }}
          path: reports/output/eval_results.json
          retention-days: 90

      - name: Post results summary to job
        run: |
          if [ -f reports/output/eval_results.json ]; then
            python - <<'EOF'
          import json
          with open("reports/output/eval_results.json") as f:
              data = json.load(f)
          s = data["summary"]
          print(f"## RAGAS Results")
          print(f"- Overall Score : {s['overall_score']} ({s['quality']})")
          print(f"- Faithfulness  : {s['avg_faithfulness']}")
          print(f"- Relevancy     : {s['avg_answer_relevancy']}")
          print(f"- Precision     : {s['avg_context_precision']}")
          print(f"- Samples       : {s['num_samples']}")
          EOF
          fi
        shell: bash
