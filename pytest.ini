[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show 10 slowest tests, verbose output
addopts =
    -v
    --tb=short
    --durations=10
    -p no:warnings

# Markers (used for selective test runs)
markers =
    unit: fast unit tests with no external dependencies
    integration: tests that require a running API or real embeddings
    slow: tests that take >5s
